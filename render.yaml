services:
  - type: web
    name: tecnowallet
    runtime: node
    plan: starter
    # Install + compile API. postinstall also builds as a safety net.
    buildCommand: YARN_PRODUCTION=false yarn install --frozen-lockfile
    startCommand: yarn start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_BUNDLE_ID
        value: com.tecnowallet.mobile
      - key: APNS_KEY_BASE64
        sync: false
      - key: APNS_PRODUCTION
        value: "true"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: contact@tecnowallet.app
      - key: BREVO_SENDER_NAME
        value: TecnoWallet
      - key: UNIT_API_URL
        value: https://api.s.unit.sh
      - key: UNIT_API_TOKEN
        sync: false
      - key: UNIT_WEBHOOK_SECRET
        sync: false
      - key: UNIT_WALLET_TERMS
        sync: false
